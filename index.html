<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SA DESKA - Data RT/RW Kabupaten Pandeglang</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- KOTAK / MODAL LOGIN -->
  <div id="login-section" style="max-width: 400px; margin: 20px auto; padding: 20px; background: #1a1a2e; border-radius: 8px; color: #fff;">
    <h3>🔐 Login Si DESKA</h3>
    <form id="login-form">
      <div style="margin-bottom: 10px;">
        <label for="email" style="display: block; margin-bottom: 5px;">Email:</label>
        <input type="email" id="email" required style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;">
      </div>
      <div style="margin-bottom: 15px;">
        <label for="password" style="display: block; margin-bottom: 5px;">Password:</label>
        <input type="password" id="password" required style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;">
      </div>
      <button type="submit" style="width: 100%; padding: 10px; background: #4f46e5; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Masuk</button>
    </form>
  </div>

  <!-- NAVIGASI UTAMA -->
  <div class="nav" style="margin-top: 20px; text-align: center;">
    <button class="active" onclick="showTab('dashboard')">📊 Dashboard</button>
    <button onclick="showTab('input')">📝 Input Data</button>
    <button onclick="showTab('profile')">👤 Profil</button>
  </div>

  <!-- DASHBOARD -->
  <div id="tab-dashboard" class="tab-content" style="padding: 15px;">
    <h3>📊 Dashboard</h3>
    <div id="feed">Belum ada data. Ajak teman-teman mengisi! 🚀</div>
  </div>

  <!-- INPUT DATA -->
  <div id="tab-input" class="tab-content hidden" style="padding: 15px;">
    <h3>📝 Input Data</h3>
    <p style="font-size: 12px; color: #888;">Pilih sektor dan wilayah Anda di bawah ini:</p>
    <div class="card" style="background: #1e1e2f; padding: 15px; border-radius: 8px; color: #fff;">
      <label>Sektor</label>
      <select id="inputSektor" style="width: 100%; padding: 8px; margin-bottom: 10px;"></select>
      
      <label>Kecamatan</label>
      <select id="inputKecamatan" style="width: 100%; padding: 8px; margin-bottom: 10px;"></select>
      
      <label>Desa</label>
      <input type="text" id="inputDesa" placeholder="Nama Desa" style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box;">
      
      <label>Nilai</label>
      <input type="number" id="inputNilai" placeholder="Angka / Nilai" style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box;">
      
      <label>Nama Pelapor</label>
      <input type="text" id="inputPelapor" placeholder="Nama Anda" style="width: 100%; padding: 8px; margin-bottom: 15px; box-sizing: border-box;">
      
      <button onclick="submitData()" style="width: 100%; padding: 10px; background: #10b981; color: #white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Kirim Data</button>
      <div id="statusMsg" style="margin-top: 10px;"></div>
    </div>
  </div>

  <!-- PROFIL -->
  <div id="tab-profile" class="tab-content hidden" style="padding: 15px; color: #fff;">
    <h3>👤 Profil</h3>
    <div class="card" style="background: #1e1e2f; padding: 15px; border-radius: 8px;">
      <p>🌐 Si DESKA</p>
      <p>📊 48 Sektor • 35 Kecamatan</p>
      <p>👥 WPS - Warga Pandeglang Sejahtera</p>
    </div>
  </div>

  <!-- SDK FIREBASE (COMPAT) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <!-- SCRIPT UTAMA ANDA -->
  <script src="script.js"></script>

  <script>
    // Fungsi sederhana untuk pindah tab (jika belum ada di script.js)
    function showTab(tabName) {
      document.getElementById('tab-dashboard').classList.add('hidden');
      document.getElementById('tab-input').classList.add('hidden');
      document.getElementById('tab-profile').classList.add('hidden');
      
      if(tabName === 'dashboard') document.getElementById('tab-dashboard').classList.remove('hidden');
      if(tabName === 'input') document.getElementById('tab-input').classList.remove('hidden');
      if(tabName === 'profile') document.getElementById('tab-profile').classList.remove('hidden');
    }
  </script>
</body>
</html>
