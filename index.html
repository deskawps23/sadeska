<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SA DESKA - Data RT/RW Kabupaten Pandeglang</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- AREA LOGIN (Menyesuaikan dengan style.css Anda) -->
  <div id="login-container" style="padding: 20px; max-width: 400px; margin: auto;">
    <h3>🔐 Login Si DESKA</h3>
    <form id="login-form">
      <div>
        <label>Email:</label><br>
        <input type="email" id="email" required style="width: 100%; padding: 8px; margin-bottom: 10px;">
      </div>
      <div>
        <label>Password:</label><br>
        <input type="password" id="password" required style="width: 100%; padding: 8px; margin-bottom: 10px;">
      </div>
      <button type="submit" style="width: 100%; padding: 10px;">Masuk</button>
    </form>
  </div>

  <!-- STRUKTUR ASLI HALAMAN ANDA -->
  <div class="nav">
    <button class="active" onclick="showTab('dashboard')">📊 Dashboard</button>
    <button onclick="showTab('input')">📝 Input</button>
    <button onclick="showTab('profile')">👤 Profil</button>
  </div>

  <!-- DASHBOARD -->
  <div id="tab-dashboard">
    <h3>📊 Dashboard</h3>
    <div id="feed">Belum ada data. Ajak teman-teman mengisi! 🚀</div>
  </div>

  <!-- INPUT -->
  <div id="tab-input" class="hidden">
    <h3>📝 Input Data</h3>
    <p style="font-size:12px;color:#888;">Pilih sektor dan wilayah Anda</p>
    <div class="card">
      <label>Sektor</label>
      <select id="inputSektor"></select>
      <label>Kecamatan</label>
      <select id="inputKecamatan"></select>
      <label>Desa</label>
      <input type="text" id="inputDesa" placeholder="Nama Desa">
      <label>Nilai</label>
      <input type="number" id="inputNilai" placeholder="Nilai">
      <label>Nama Pelapor</label>
      <input type="text" id="inputPelapor" placeholder="Nama Pelapor">
      <button onclick="submitData()">📥 Kirim Data</button>
      <div id="statusMsg"></div>
    </div>
  </div>

  <!-- PROFILE -->
  <div id="tab-profile" class="hidden">
    <h3>👤 Profil</h3>
    <div class="card">
      <p>🌐 Si DESKA</p>
      <p>📊 48 Sektor • 35 Kecamatan</p>
      <p>👥 WPS - Warga Pandeglang Sejahtera</p>
    </div>
  </div>

  <!-- SDK FIREBASE (COMPAT) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <!-- SCRIPT UTAMA -->
  <script src="script.js"></script>
</body>
        </html>
